apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: consent-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: consent}
            - {name: POSTGRES_USER, value: consent}
            - {name: POSTGRES_PASSWORD, value: consent}
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: consent-lab}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
