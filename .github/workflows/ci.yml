name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: consent, POSTGRES_USER: consent, POSTGRES_PASSWORD: consent}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U consent -d consent"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B verify
        working-directory: backend
        env: {DATABASE_URL: jdbc:postgresql://localhost:5432/consent, DATABASE_USER: consent, DATABASE_PASSWORD: consent}
      - name: Coverage summary
        working-directory: backend
        run: |
          python3 - <<'PY'
          import csv
          c=m=0
          for r in csv.DictReader(open("target/site/jacoco/jacoco.csv")):
              m+=int(r["INSTRUCTION_MISSED"]); c+=int(r["INSTRUCTION_COVERED"])
          t=c+m or 1
          print(f"COVERAGE={100*c/t:.2f}% instructions ({c}/{t})")
          PY
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install && npm run build
        working-directory: frontend
  api-tests:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: consent, POSTGRES_USER: consent, POSTGRES_PASSWORD: consent}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U consent -d consent"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Build backend
        working-directory: backend
        run: mvn -B -q -DskipTests package
      - name: Start backend and wait for health
        working-directory: backend
        env: {DATABASE_URL: jdbc:postgresql://localhost:5432/consent, DATABASE_USER: consent, DATABASE_PASSWORD: consent}
        run: |
          java -jar "$(ls target/*.jar | head -1)" > app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:8080/actuator/health && echo " up" && exit 0
            sleep 3
          done
          echo "backend did not become healthy"; tail -n 30 app.log; exit 1
      - run: npm install -g @usebruno/cli
      - name: Smoke test (Bruno)
        run: bru run api-tests --env local
  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    continue-on-error: true   # non-blocking: Playwright needs the portal served; see README
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install && npx playwright install --with-deps chromium && npx playwright test
        working-directory: e2e
  manifests:
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking: kind + image pulls are heavy; see README
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: helm/kind-action@v1
      - run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary k8s/*.yaml
          kind create cluster --wait 60s
          kubectl apply -f k8s/
          kubectl wait --for=condition=Available deployment --all -n consent-lab --timeout=120s
  jenkinsfile-lint:
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking: needs a reachable Jenkins server; see README
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s https://www.jenkins.io/jenkins-cli.jar -o jenkins-cli.jar
          java -jar jenkins-cli.jar -s https://jenkins.example.invalid declarative-linter < Jenkinsfile
  sonar:
    runs-on: ubuntu-latest
    continue-on-error: true   # non-blocking: SonarQube needs a server/token (no accounts in this lab); see README
    steps:
      - uses: actions/checkout@v4
      - run: echo "SonarQube quality gate is a placeholder; configure a scanner+server to enforce."
